name: Package QGIS plugin release

on:
  push:
    tags:
      - "v*"
    branches:
      - "package-fix-v2.8.4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate plugin metadata
        run: |
          test -f metadata.txt
          test -f __init__.py
          grep -E '^name=' metadata.txt
          grep -E '^version=' metadata.txt

      - name: Build installable ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path(".")
          package_name = "SLS_Magic_AutoSnap_Bangunan"
          output = Path(f"{package_name}_{__import__('os').environ.get('GITHUB_REF_NAME', 'v2.8.4')}.zip")
          excluded_dirs = {".git", ".github", "__pycache__", "dist"}
          excluded_files = {".gitignore", "CHANGELOG.md"}
          with ZipFile(output, "w", ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root)
                  if any(part in excluded_dirs for part in rel.parts):
                      continue
                  if p.name in excluded_files or p.suffix in {".pyc", ".pyo"}:
                      continue
                  z.write(p, Path(package_name) / rel)
          with ZipFile(output) as z:
              names = z.namelist()
              assert f"{package_name}/metadata.txt" in names
              assert f"{package_name}/__init__.py" in names
          print(f"Created {output} ({output.stat().st_size} bytes)")
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLS_Magic_AutoSnap_Bangunan_v2.8.4
          path: SLS_Magic_AutoSnap_Bangunan_*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SLS_Magic_AutoSnap_Bangunan_*.zip
          generate_release_notes: true
