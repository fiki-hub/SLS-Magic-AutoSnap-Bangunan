name: Package QGIS plugin release

on:
  push:
    tags:
      - "v*"
    branches:
      - "package-fix-v2.8.4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate plugin metadata
        run: |
          test -f metadata.txt
          test -f __init__.py
          grep -E '^name=' metadata.txt
          grep -E '^version=' metadata.txt

      - name: Build installable ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os

          package_name = "SLS_Magic_AutoSnap_Bangunan"
          output = Path(f"{package_name}_{os.environ.get('GITHUB_REF_NAME', 'v2.8.4')}.zip")
          # Include only plugin runtime files. Avoid bundling test/data files,
          # and never recursively include the ZIP being created.
          include_files = {
              "__init__.py",
              "autosnap.py",
              "metadata.txt",
              "icon.svg",
              "village_reference.py",
              "README.txt",
          }

          with ZipFile(output, "w", ZIP_DEFLATED) as z:
              for name in sorted(include_files):
                  p = Path(name)
                  if p.is_file():
                      z.write(p, Path(package_name) / name)

          with ZipFile(output) as z:
              names = set(z.namelist())
              assert f"{package_name}/metadata.txt" in names
              assert f"{package_name}/__init__.py" in names
              assert f"{package_name}/autosnap.py" in names
          print(f"Created {output} ({output.stat().st_size} bytes)")
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLS_Magic_AutoSnap_Bangunan_v2.8.4
          path: SLS_Magic_AutoSnap_Bangunan_*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SLS_Magic_AutoSnap_Bangunan_*.zip
          generate_release_notes: true
